<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>小テスト</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1d2420;--sub:#5d6a62;--line:#d6ddd8;--accent:#3d5a40;--warn:#b3261e;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141815;--card:#1d231f;--ink:#e6ebe7;--sub:#9aa79f;--line:#334038;--accent:#7fa883;--warn:#ef7b72;--on:#101410}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.7;
 min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:360px;box-sizing:border-box}
h1{font-size:1.3rem;margin:0 0 4px}p{color:var(--sub);font-size:.9rem;margin:0 0 16px}
input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{margin-top:12px;width:100%;font:inherit;font-weight:bold;padding:10px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on);cursor:pointer}
button:disabled{opacity:.5}
.note{border:1px solid var(--accent);border-radius:8px;padding:10px 12px;margin:8px 0 14px;font-size:.9rem;line-height:1.6}
.note b{display:block;color:var(--accent);margin-bottom:2px}#err{color:var(--warn);font-size:.9rem;min-height:1.5em;margin-top:8px}
</style></head><body>
